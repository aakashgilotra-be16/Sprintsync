<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0052CC" opacity="0.95"/>
  
  <!-- Clock face -->
  <circle cx="32" cy="32" r="24" fill="white"/>
  
  <!-- Clock border -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#0052CC" stroke-width="1.5"/>
  
  <!-- Hour markers -->
  <line x1="32" y1="10" x2="32" y2="14" stroke="#0052CC" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50.6" y1="32" x2="54" y2="32" stroke="#0052CC" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="32" y2="50" stroke="#0052CC" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="13.4" y1="32" x2="10" y2="32" stroke="#0052CC" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="32" cy="32" r="2.5" fill="#0052CC"/>
  
  <!-- Hour hand (pointing to 10) -->
  <line x1="32" y1="32" x2="28" y2="20" stroke="#0052CC" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Minute hand (pointing to 2) -->
  <line x1="32" y1="32" x2="44" y2="24" stroke="#0052CC" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Sprint indicator (small arc in corner) -->
  <path d="M 48 16 Q 52 12 56 16" fill="none" stroke="#0052CC" stroke-width="1.5" stroke-linecap="round"/>
</svg>
